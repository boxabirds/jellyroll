<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jellyland water designer</title>
<style>
  :root { color-scheme: dark; --panel: rgb(18 24 30 / 92%); --edge: #ffffff22; --accent: #46c4d8; --ink: #e8f0f4; --soft: #9fb2bc; }
  html, body { margin: 0; height: 100%; background: #0b1013; color: var(--ink); font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0 340px 0 0; }
  #view canvas { display: block; width: 100%; height: 100%; }
  #panel { position: fixed; top: 0; right: 0; bottom: 0; width: 340px; background: var(--panel); border-left: 1px solid var(--edge); overflow-y: auto; padding: 10px 12px 40px; box-sizing: border-box; }
  h1 { font-size: 15px; margin: 4px 0 2px; }
  p.lead { margin: 0 0 8px; color: var(--soft); font-size: 12px; }
  details { border-top: 1px solid var(--edge); padding: 6px 0; }
  summary { cursor: pointer; font-weight: 600; font-size: 13px; padding: 2px 0; }
  .blurb { color: var(--soft); font-size: 11px; margin: 2px 0 6px; }
  .row { display: grid; grid-template-columns: 1fr 64px; gap: 2px 8px; align-items: center; margin: 4px 0; }
  .row label { grid-column: 1 / 3; display: flex; justify-content: space-between; }
  .row output { color: var(--accent); font-variant-numeric: tabular-nums; }
  .row input[type=range] { grid-column: 1 / 3; width: 100%; accent-color: var(--accent); }
  .row input[type=color] { width: 100%; height: 24px; padding: 0; border: 1px solid var(--edge); background: none; }
  .hint { grid-column: 1 / 3; color: var(--soft); font-size: 11px; }
  #bar { position: fixed; left: 12px; top: 12px; display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100vw - 380px); z-index: 3; }
  button { font: inherit; padding: 6px 11px; border-radius: 8px; border: 1px solid var(--edge); background: #1d2a33; color: var(--ink); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.on { background: var(--accent); color: #062026; border-color: var(--accent); }
  #fps { position: fixed; left: 12px; bottom: 34px; z-index: 4; font: 700 30px ui-monospace, monospace; text-shadow: 0 1px 4px #000; }
  #fps small { display: block; font: 12px system-ui, sans-serif; color: #dfeaf0; font-weight: 400; }
  #status { position: fixed; left: 12px; bottom: 12px; color: var(--soft); font-size: 12px; z-index: 3; text-shadow: 0 1px 2px #000; }
  #fatal { position: fixed; inset: 0; display: none; place-items: center; background: #0b1013; z-index: 9; padding: 30px; white-space: pre-wrap; }
  details details { margin-left: 8px; }
  .tools { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  select { font: inherit; background: #1d2a33; color: var(--ink); border: 1px solid var(--edge); border-radius: 8px; padding: 5px; }
  textarea { width: 100%; height: 90px; background: #0e171d; color: var(--ink); border: 1px solid var(--edge); border-radius: 8px; font: 11px ui-monospace, monospace; box-sizing: border-box; }
</style>
</head>
<body>
<div id="view"></div>
<div id="bar"></div>
<div id="fps">–<small></small></div>
<div id="status">loading…</div>
<aside id="panel"></aside>
<div id="fatal"></div>
<script type="module" src="/src/water-lab/designer.ts"></script>
</body>
</html>
